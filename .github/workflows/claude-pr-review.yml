# Claude PR review — calls the shared reusable workflow in
# jedwards1230/release-workflows (claude-code-action@v1, Haiku, with the public
# jedwards1230-plugins marketplace + review-team plugin + github_ci by default).
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, closed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.action != 'closed'
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review.yml@ba35e100f83d7276cf4cf519ae89bb0597fca04c # v1.13.1
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # preferred (subscription)
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LITELLM_CI_KEY: ${{ secrets.LITELLM_CI_KEY }}
      LENS_TRACING_KEY: ${{ secrets.LENS_TRACING_KEY }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      LITELLM_CI_BASE_URL: ${{ secrets.LITELLM_CI_BASE_URL }}
      LENS_CI_OTLP_ENDPOINT: ${{ secrets.LENS_CI_OTLP_ENDPOINT }}
    with:
      extra_plugins: |
        plugin-dev@claude-plugins-official
        go-quality@jedwards1230-plugins
      extra_plugin_marketplaces: |
        https://github.com/anthropics/claude-plugins-official.git
      focus: |
        wiki-server is a Go HTTP service rendering an Obsidian vault to HTML.
        - Path traversal: request paths reaching filepath.Join / file reads (the
          /raw and .md handlers) need Clean + a containment check; reject ".."
          and absolute paths.
        - HTML/template injection (XSS): unescaped vault content, template.HTML
          casts, goldmark unsafe-HTML, or text/template where html/template is
          required.
        - HTTP input handling; Go correctness (ignored errors, nil deref,
          unchecked type assertions, missing defer Close).
        - Code↔chart drift: a new WIKI_* env var / flag / port must be exposed in
          the Helm chart under deploy/helm/my-wiki/.
        - For plugin files (manifest, hooks, skills, agents, commands), use plugin-dev's plugin-validator / skill-reviewer agents.
        - When the diff touches Go, prioritize the go-quality:go-reviewer agent for language-specific Go review.
        Do NOT re-flag gofmt/go vet/golangci-lint — CI owns those.

  cancel-review:
    if: github.event.action == 'closed'
    permissions:
      actions: write
    uses: jedwards1230/release-workflows/.github/workflows/claude-pr-review-cancel.yml@9a48fc8ec1985081e7337e4ae6669a2753f847ef # v1
    with:
      review_workflow: "PR Review"

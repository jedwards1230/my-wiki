# Auto-version and release on push to main.
# Decides whether to release and the bump type from the merged PR:
#   1. A semver:major|minor|patch label always wins; semver:none skips the
#      release. This holds even when the diff is dev-only.
#   2. No label: the PR's changed files are checked against the DEV_ONLY list
#      in the detect step. If EVERY file is dev-only (CI, docs, tests, dev
#      tooling) no release is cut; otherwise it releases as patch.
#   3. No associated PR (direct push) or the files API fails: patch, with a
#      ::warning::.
#   4. workflow_dispatch always releases with the chosen bump.
# When a release is due, it delegates the version/tag/AI-release-notes
# pipeline to the shared
# jedwards1230/release-workflows/.github/workflows/ai-release.yml workflow,
# builds the Docker image + publishes the Helm chart, and creates the GitHub
# Release with install snippets prepended to the AI-generated body.

name: Release

run-name: >-
  ${{
    github.event_name == 'workflow_dispatch'
      && format('Release: {0}{1}',
           inputs.dry_run && 'dry-run ' || '',
           inputs.bump_type)
      || format('Release: {0}', github.event.head_commit.message || github.sha)
  }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      dry_run:
        description: "Dry run — compute version and preview notes without tagging or publishing"
        required: false
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect:
    name: Detect bump type
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.bump.outputs.release }}
      bump_type: ${{ steps.bump.outputs.type }}
      dry_run: ${{ steps.bump.outputs.dry_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/.releaseignore
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_BUMP_TYPE: ${{ inputs.bump_type }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # Dev-only paths live in .github/.releaseignore (gitignore syntax),
          # matched with git's own engine via `git check-ignore`. Anything the
          # file does not match is product.
          RELEASEIGNORE="${GITHUB_WORKSPACE}/.github/.releaseignore"

          # workflow_dispatch: use provided inputs, always release
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            {
              echo "release=true"
              echo "type=${INPUT_BUMP_TYPE}"
            } >> "$GITHUB_OUTPUT"
            if [ "${INPUT_DRY_RUN}" = "true" ]; then
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Dry run: previewing release with bump_type=${INPUT_BUMP_TYPE}"
            else
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          echo "dry_run=false" >> "$GITHUB_OUTPUT"

          # push event: find the merged PR. Retry up to 3 times -- the API may
          # not have the merge commit indexed immediately after the push fires.
          # The same response carries the PR's labels, so there is no second
          # call whose failure could masquerade as "no label".
          PR=""
          LABELS=""
          for attempt in 1 2 3; do
            INFO=$(gh api "repos/${GH_REPO}/commits/${GITHUB_SHA}/pulls" \
              --jq "[.[] | select(.merge_commit_sha == \"${GITHUB_SHA}\")][0] // empty | {number, labels: [.labels[].name]}" \
              2>/dev/null || true)
            if [ -n "$INFO" ]; then
              PR=$(jq -r '.number' <<< "$INFO")
              LABELS=$(jq -r '.labels[]' <<< "$INFO")
              break
            fi
            echo "Attempt ${attempt}: no PR found for ${GITHUB_SHA}, retrying in 5s..."
            sleep 5
          done

          if [ -z "$PR" ]; then
            echo "::warning::No merged PR found for ${GITHUB_SHA}; cannot read labels or files, defaulting to a patch release"
            {
              echo "release=true"
              echo "type=patch"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "PR #${PR} labels: ${LABELS:-<none>}"

          # Changed files, including the old path of renames (a rename OUT of a
          # product path must count as a product change). Empty -> ""; an API
          # failure -> FILES_OK=false.
          FILES_OK=true
          if ! FILES=$(gh api "repos/${GH_REPO}/pulls/${PR}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)'); then
            FILES_OK=false
          fi
          [ -z "$FILES" ] && FILES_OK=false

          # Classify the files with .github/.releaseignore. FIRST_PRODUCT stays
          # empty only when EVERY file is dev-only. A missing/empty ignore file
          # means nothing is dev-only; a check-ignore error is treated like an
          # unreadable diff (FILES_OK=false -> rule 3).
          FIRST_PRODUCT=""
          TOTAL=0
          # Every step returns non-zero explicitly: inside `if ! classify`, set -e
          # is suspended, so an unchecked failure would silently misclassify.
          classify() {
            local scratch rc=0 m f
            mapfile -t FILE_LIST < <(printf '%s\n' "$FILES" | sort -u) || return 1
            TOTAL=${#FILE_LIST[@]}
            if [ ! -s "$RELEASEIGNORE" ]; then
              echo "::notice::.github/.releaseignore is missing or empty; no path is dev-only"
              FIRST_PRODUCT="${FILE_LIST[0]}"
              return 0
            fi
            scratch=$(mktemp -d) || return 1
            # shellcheck disable=SC2064 # expand now: scratch is local to this function
            trap "rm -rf '$scratch' '$scratch.paths' '$scratch.matched'" RETURN
            git init -q "$scratch" || return 1
            printf '%s\0' "${FILE_LIST[@]}" > "$scratch.paths" || return 1
            git -C "$scratch" -c core.excludesFile="$RELEASEIGNORE" \
              check-ignore --no-index -z --stdin < "$scratch.paths" > "$scratch.matched" || rc=$?
            [ "$rc" -le 1 ] || return 1
            mapfile -d '' MATCHED < "$scratch.matched" || return 1
            declare -gA IS_DEV=()
            for m in "${MATCHED[@]}"; do IS_DEV["$m"]=1; done
            for f in "${FILE_LIST[@]}"; do
              if [ -z "${IS_DEV[$f]:-}" ]; then FIRST_PRODUCT="$f"; break; fi
            done
            return 0
          }
          if [ "$FILES_OK" = true ] && ! classify; then
            echo "::warning::Could not classify changed files against .github/.releaseignore; defaulting to a patch release (a semver:* label still wins)"
            FILES_OK=false
          fi

          # Rule 1: an explicit label wins, even for a dev-only diff.
          LABEL_TYPE=""
          for t in major minor patch none; do
            if echo "$LABELS" | grep -qx "semver:${t}"; then
              LABEL_TYPE="$t"
              break
            fi
          done
          if [ -n "$LABEL_TYPE" ]; then
            if [ "$LABEL_TYPE" = none ]; then
              echo "::notice::PR #${PR} is labelled semver:none; skipping the release"
              {
                echo "release=false"
                echo "type=patch"
              } >> "$GITHUB_OUTPUT"
            else
              echo "::notice::PR #${PR} is labelled semver:${LABEL_TYPE}; releasing as ${LABEL_TYPE}"
              {
                echo "release=true"
                echo "type=${LABEL_TYPE}"
              } >> "$GITHUB_OUTPUT"
              if [ "$FILES_OK" = true ] && [ -z "$FIRST_PRODUCT" ]; then
                echo "::warning::PR #${PR} is labelled semver:${LABEL_TYPE} but every changed file is dev-only; semver:none (or no label) would have skipped this release"
              fi
            fi
            exit 0
          fi

          # Rule 3: cannot inspect the diff -> keep the old default (patch).
          if [ "$FILES_OK" != true ]; then
            echo "::warning::Could not inspect changed files for PR #${PR}; defaulting to a patch release"
            {
              echo "release=true"
              echo "type=patch"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Rule 2: no label -> release unless every file is dev-only.
          if [ -z "$FIRST_PRODUCT" ]; then
            echo "::notice::Dev-only rule: all ${TOTAL} changed file(s) in PR #${PR} are dev-only; skipping the release"
            printf '  dev-only: %s\n' "${FILE_LIST[@]:0:10}"
            {
              echo "release=false"
              echo "type=patch"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Releasing PR #${PR} as patch; first non-dev-only file: ${FIRST_PRODUCT}"
            {
              echo "release=true"
              echo "type=patch"
            } >> "$GITHUB_OUTPUT"
          fi

  prepare:
    name: Tag & Generate Notes
    needs: [detect]
    if: needs.detect.outputs.release == 'true'
    uses: jedwards1230/release-workflows/.github/workflows/ai-release.yml@9a48fc8ec1985081e7337e4ae6669a2753f847ef # v1
    with:
      service_name: my-wiki
      service_description: "an Obsidian-backed wiki with a native Go renderer, served from K8s"
      bump_type: ${{ needs.detect.outputs.bump_type }}
      chart_path: deploy/helm/my-wiki/Chart.yaml
      dry_run: ${{ needs.detect.outputs.dry_run == 'true' }}
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  build:
    name: Build and Push Image
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm:
    name: Publish Helm Chart
    needs: [detect, prepare]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push
        run: |
          helm package deploy/helm/my-wiki/
          helm push my-wiki-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Write summary
        run: |
          CHART_VERSION=$(grep '^version:' deploy/helm/my-wiki/Chart.yaml | awk '{print $2}')
          {
            echo "## Helm Chart Published"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Chart Version | ${CHART_VERSION} |"
            echo "| Registry | \`oci://ghcr.io/${{ github.repository_owner }}/charts/my-wiki\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub Release
    needs: [detect, prepare, build, helm]
    if: needs.detect.outputs.release == 'true' && needs.detect.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Compose release body (install snippets + AI notes)
        env:
          BODY_B64: ${{ needs.prepare.outputs.release_body }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # ai-release.yml emits a base64-encoded body; decode before use.
          echo "$BODY_B64" | base64 -d > /tmp/ai_body.md

          # Prepend install snippets so consumers see "how do I get this?"
          # before scrolling through the AI summary + commit list.
          {
            echo "## Install"
            echo ""
            echo "### Docker"
            echo ""
            echo '```bash'
            echo "docker pull ${REGISTRY}/${IMAGE_NAME}:${VERSION}"
            echo '```'
            echo ""
            echo "### Helm"
            echo ""
            echo '```bash'
            echo "helm install wiki oci://ghcr.io/${REPO_OWNER}/charts/my-wiki --version ${VERSION}"
            echo '```'
            echo ""
            echo "---"
            echo ""
          } > /tmp/release_body.md
          cat /tmp/ai_body.md >> /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Release ${{ needs.prepare.outputs.version }}
          body_path: /tmp/release_body.md
          make_latest: true

      - name: Write workflow summary
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          BUMP_TYPE: ${{ needs.detect.outputs.bump_type }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "## Release ${TAG}"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Version | ${VERSION} |"
            echo "| Image | \`${REGISTRY}/${IMAGE_NAME}:${VERSION}\` |"
            echo "| Chart | \`oci://ghcr.io/${REPO_OWNER}/charts/my-wiki:${VERSION}\` |"
            echo "| Bump | ${BUMP_TYPE} |"
          } >> "$GITHUB_STEP_SUMMARY"

{{- if .Values.obsidianSync.standalone }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-sync
  labels:
    app.kubernetes.io/name: wiki-sync
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/component: sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wiki-sync
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wiki-sync
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      securityContext:
        fsGroup: 100
        {{- with .Values.podSecurityContext.fsGroupChangePolicy }}
        fsGroupChangePolicy: {{ . }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      initContainers:
        - name: setup-sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              {{- regexReplaceAll "[ \t]+\n" (include "my-wiki.syncSetupScript" . | nindent 14) "\n" }}
          env:
            - name: OBSIDIAN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.obsidianSecretName | default (printf "%s-obsidian" .Release.Name) }}
                  key: OBSIDIAN_EMAIL
            - name: OBSIDIAN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.obsidianSecretName | default (printf "%s-obsidian" .Release.Name) }}
                  key: OBSIDIAN_PASSWORD
            - name: OBSIDIAN_E2E_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.obsidianSecretName | default (printf "%s-obsidian" .Release.Name) }}
                  key: OBSIDIAN_E2E_PASSWORD
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sync-home
              mountPath: /data/home
          resources:
            {{- toYaml .Values.resources.setupSync | nindent 12 }}

      containers:
        - name: sync
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              {{- regexReplaceAll "[ \t]+\n" (include "my-wiki.syncRunScript" . | nindent 14) "\n" }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: sync-home
              mountPath: /data/home
          {{- if .Values.obsidianSync.probes.readiness.enabled }}
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  {{- regexReplaceAll "[ \t]+\n" (include "my-wiki.syncFreshnessScript" (dict "root" . "grace" false "staleAfter" .Values.obsidianSync.probes.readiness.staleAfterSeconds) | nindent 18) "\n" }}
            initialDelaySeconds: {{ .Values.obsidianSync.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.obsidianSync.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.obsidianSync.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.obsidianSync.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.obsidianSync.probes.liveness.enabled }}
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - |
                  {{- regexReplaceAll "[ \t]+\n" (include "my-wiki.syncLockLivenessScript" (dict "staleAfter" .Values.obsidianSync.probes.liveness.staleAfterSeconds) | nindent 18) "\n" }}
            initialDelaySeconds: {{ .Values.obsidianSync.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.obsidianSync.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.obsidianSync.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.obsidianSync.probes.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources.sync | nindent 12 }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        # /data/home carries obsidian-headless's SQLite sync state, which cannot
        # live on the shared RWX (NFS) volume — see obsidianSync.homePersistence.
        - name: sync-home
          {{- if .Values.obsidianSync.homePersistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-sync-home
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
